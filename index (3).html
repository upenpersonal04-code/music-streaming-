<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wavy – Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1 class="logo">Wavy</h1>
      <nav>
        <button class="nav active" data-view="all">Home</button>
        <button class="nav" data-view="liked">Liked songs</button>
      </nav>
    </aside>

    <main>
      <input id="search" type="search" placeholder="Search songs or artists" aria-label="Search">
      <h2 id="heading">All songs</h2>
      <ul id="list"></ul>
      <p id="empty" hidden>No songs here yet. Tap the heart on a song to save it.</p>
    </main>
  </div>

  <footer class="player">
    <div class="now">
      <div id="cover" class="cover"></div>
      <div class="meta"><strong id="pTitle">Pick a song</strong><span id="pArtist">to start listening</span></div>
    </div>

    <div class="controls">
      <div class="btns">
        <button id="shuffle" title="Shuffle" aria-label="Shuffle">⇄</button>
        <button id="prev" title="Previous" aria-label="Previous">⏮</button>
        <button id="play" class="play" title="Play" aria-label="Play">▶</button>
        <button id="next" title="Next" aria-label="Next">⏭</button>
        <button id="repeat" title="Repeat" aria-label="Repeat">↻</button>
      </div>
      <div class="bar">
        <span id="cur">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" aria-label="Seek">
        <span id="dur">0:00</span>
      </div>
    </div>

    <div class="vol">
      <span>Vol</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
  </footer>

  <audio id="audio" preload="metadata"></audio>
  <script src="script.js"></script>
</body>
</html>
